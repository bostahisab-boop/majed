<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sale - Mahadebpur Rice Mill</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:sans-serif;padding:12px;background:#f2f2f2;margin:0}
h2{text-align:center}
.card{background:#fff;padding:14px;border-radius:12px}
input,select,button{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #ddd;font-size:16px;box-sizing:border-box}
button{background:#16a34a;color:#fff;font-weight:bold;border:none}
.row{display:flex;gap:8px}.row>*{flex:1}
#msg{font-weight:bold;text-align:center;color:green}
a{display:block;text-align:center;margin-top:10px;color:#2563eb}
</style>
</head>
<body>
<h2>🧾 Sale - ধান বিক্রি</h2>
<div class="card">
<input id="customer" placeholder="Customer Name - কাস্টমার নাম">
<select id="paddy">
<option value="KatarI Dhan|40">KatarI Dhan - 40 KG / Mon</option>
<option value="Miniket Dhan|37.5">Miniket Dhan - 37.5 KG / Mon</option>
<option value="Atash Dhan|38.5">Atash Dhan - 38.5 KG / Mon</option>
<option value="BRI-28 Dhan|38">BRI-28 Dhan - 38 KG / Mon</option>
</select>
<div class="row">
<input id="bags" type="number" placeholder="Bags - ব্যাগ" oninput="calc()">
<input id="kg" type="number" placeholder="Total KG" oninput="calc()">
</div>
<div class="row">
<input id="mon" readonly placeholder="Mon - মন">
<input id="rate" type="number" placeholder="Rate - দর / মন" oninput="calc()">
</div>
<input id="total" readonly placeholder="Total Taka">
<input id="cash" type="number" placeholder="Cash Diloo - নগদ কত দিলো" oninput="calc()">
<input id="due" readonly placeholder="Due - বাকি">
<button onclick="save()">✅ Sale Save করেন</button>
<p id="msg"></p>
</div>
<a href="daybook.html">📒 Daybook Dekhen</a>
<a href="purchase.html">🛒 Purchase Form</a>

<script>
const supabase = window.supabase.createClient("https://itfagvgggndltwdlbnph.supabase.co","sb_publishable_tAetMrjqhCrwI2f87oIwCA_6pXxnxir");

function calc(){
  let bags = +document.getElementById('bags').value || 0;
  let kg = +document.getElementById('kg').value || 0;
  let parts = document.getElementById('paddy').value.split('|');
  let kgmon = +parts[1];
  if(!kg && bags){ kg = bags*80; document.getElementById('kg').value = kg; }
  let mon = kg / kgmon;
  let rate = +document.getElementById('rate').value || 0;
  let total = mon * rate;
  let cash = +document.getElementById('cash').value || 0;
  document.getElementById('mon').value = mon.toFixed(2);
  document.getElementById('total').value = Math.round(total);
  document.getElementById('due').value = Math.round(total - cash);
}

async function save(){
  let parts = document.getElementById('paddy').value.split('|');
  let paddy = parts[0];
  let k = +parts[1];
  let d = {
    customer_name: document.getElementById('customer').value,
    paddy_name: paddy,
    bags: +document.getElementById('bags').value || 0,
    total_kg: +document.getElementById('kg').value || 0,
    kg_per_mon: k,
    mon: +document.getElementById('mon').value || 0,
    rate: +document.getElementById('rate').value || 0,
    total: +document.getElementById('total').value || 0,
    cash: +document.getElementById('cash').value || 0,
    due: +document.getElementById('due').value || 0
  };
  if(!d.customer_name){ document.getElementById('msg').innerText = 'Customer Name দেন'; return; }
  if(!d.total){ document.getElementById('msg').innerText = 'Bags / KG / Rate দেন'; return; }

  let {error} = await supabase.from('paddy_sales').insert([d]);
  if(error){ document.getElementById('msg').innerText = 'Error: ' + error.message; return; }

  await supabase.from('daybook').insert([{
    voucher_no: 'S-' + Date.now().toString().slice(-5),
    voucher_type: 'Cash Sale',
    description: d.customer_name + ' - ' + d.paddy_name,
    person_name: d.customer_name,
    cash_in: d.cash,
    due_amount: d.due
  }]);

  document.getElementById('msg').innerText = '✅ Sale Save Hoise! Daybook e Geche!';
  document.getElementById('customer').value = '';
  document.getElementById('bags').value = '';
  document.getElementById('kg').value = '';
  document.getElementById('rate').value = '';
  document.getElementById('cash').value = '';
  document.getElementById('mon').value = '';
  document.getElementById('total').value = '';
  document.getElementById('due').value = '';
}
</script>
</body>
  </html>
